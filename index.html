<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arun's Cinematic | Photography & Cinematography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style> 
:root {
  --background: #0b0b0b;
  --text: #F5F5F5;
  --headline: #E6C36A;
  --muted: #B8B8B8;
  --border: #2A2A2A;
}   
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin: 0;
  background-color: var(--background);
  color: var(--text);
  font-family: Montserrat, sans-serif;
}

/* NAVBAR DESIGN */
.navbar {
  background: rgba(10, 10, 10, 0.95) !important;
  backdrop-filter: blur(10px);
  padding: 15px 0;
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 1000;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.navbar-brand {
  font-family: Cinzel, serif;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #fff !important;
}
.navbar-brand span { color: var(--headline); }

.nav-link {
  color: #ddd !important;
  margin-left: 12px;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 500;
  transition: 0.3s;
}
.nav-link:hover { color: var(--headline) !important; }

/* TOP ACTION BUTTONS */
.nav-btn-call {
  background: transparent;
  border: 1px solid var(--headline);
  color: var(--headline) !important;
  padding: 8px 16px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  margin-left: 10px;
  border-radius: 4px;
  text-decoration: none;
  transition: 0.3s;
}
.nav-btn-call:hover {
  background: var(--headline);
  color: #000 !important;
}

.nav-btn-book {
  background: var(--headline);
  border: 1px solid var(--headline);
  color: #000 !important;
  padding: 8px 16px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  margin-left: 8px;
  border-radius: 4px;
  text-decoration: none;
  transition: 0.3s;
}
.nav-btn-book:hover {
  background: transparent;
  color: var(--headline) !important;
}

/* HERO SPLIT SECTION */
.hero-split-section {
  min-height: 100vh;
  display: flex;
  align-items: center;
  padding-top: 110px;
  padding-bottom: 60px;
}
.hero-image-box {
  position: relative;
  width: 100%;
  height: 500px;
  overflow: hidden;
  border-bottom-right-radius: 100px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  background: #000;
}
.hero-image-box iframe {
  width: 100%;
  height: 100%;
  border: none;
  transform: scale(1.15);
}

.hero-text-box {
  padding: 20px 30px;
}
.hero-text-box h1 {
  font-family: Cinzel, serif;
  font-size: clamp(34px, 4.2vw, 52px);
  font-weight: 700;
  line-height: 1.25;
  margin-bottom: 20px;
  color: #fff;
}
.hero-text-box h1 span { color: var(--headline); }
.hero-text-box p {
  color: var(--muted);
  font-size: 15px;
  line-height: 1.8;
  margin-bottom: 30px;
}

.btn-gold {
  background: var(--headline);
  color: #000;
  border: 1px solid var(--headline);
  border-radius: 4px;
  padding: 12px 28px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.btn-gold:hover { background: transparent; color: var(--headline); }

.section { padding: 90px 0; }
.section-title { text-align: center; margin-bottom: 50px; }
.section-title small { color: var(--headline); text-transform: uppercase; letter-spacing: 4px; font-weight: 600; }
.section-title h2 { font-family: Cinzel, serif; font-size: 40px; margin-top: 10px; }
.section-title p { color: var(--muted); max-width: 600px; margin: 10px auto; }

.service-card, .package-card, .testimonial-card {
  background: #141414;
  border: 1px solid var(--border);
  padding: 35px 25px;
  height: 100%;
  transition: 0.3s;
}
.service-card:hover, .package-card:hover, .testimonial-card:hover {
  transform: translateY(-6px);
  border-color: var(--headline);
}
.service-icon { font-size: 40px; margin-bottom: 15px; }
.service-card h4, .package-card h3 { font-family: Cinzel, serif; }
.service-card p, .package-card ul, .testimonial-card p { color: var(--muted); }

.about-img { width: 100%; height: 480px; object-fit: cover; border-radius: 6px; }
.about-text h2 { font-family: Cinzel, serif; font-size: 40px; margin-top: 10px; }
.about-text p { color: var(--muted); line-height: 1.8; }

.gallery { position: relative; overflow: hidden; border-radius: 6px; }
.gallery img { width: 100%; height: 280px; object-fit: cover; transition: 0.5s; display: block; }
.gallery:hover img { transform: scale(1.08); }
.gallery-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.55);
  display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.3s;
}
.gallery:hover .gallery-overlay { opacity: 1; }
.gallery-overlay h5 { font-family: Cinzel, serif; font-size: 22px; color: #fff; }

.price { color: var(--headline); font-size: 28px; font-weight: 700; margin: 20px 0; }
.package-card ul { list-style: none; padding: 0; line-height: 2; }
.stars { color: var(--headline); margin-bottom: 10px; }
.client-name { font-family: Cinzel, serif; font-weight: 700; margin-top: 15px; color: #fff; }

/* FAQ ACCORDION STYLING */
.accordion-item {
  background-color: #141414;
  border: 1px solid var(--border);
  margin-bottom: 15px;
  border-radius: 0 !important;
}
.accordion-button {
  background-color: #1a1a1a;
  color: #fff;
  font-family: Cinzel, serif;
  font-weight: 600;
  box-shadow: none !important;
}
.accordion-button:not(.collapsed) {
  background-color: var(--headline);
  color: #000;
}
.accordion-button::after {
  filter: brightness(0) invert(1);
}
.accordion-button:not(.collapsed)::after {
  filter: brightness(0);
}
.accordion-body {
  background-color: #111;
  color: var(--muted);
  line-height: 1.7;
}

.booking-section {
  background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.92)),
  url("https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=2000&q=90") center/cover;
}
.booking-box { max-width: 800px; margin: auto; background: rgba(15,15,15,0.95); padding: 40px; border: 1px solid #333; }
.form-control, .form-select { background: #0b0b0b; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 0; }
.form-control:focus, .form-select:focus { background: #0b0b0b; color: #fff; border-color: var(--headline); box-shadow: none; }
.form-control::placeholder { color: #777; }

.contact-box { text-align: center; padding: 20px; background: #121212; border: 1px solid var(--border); height: 100%; }
.contact-box h5 { color: var(--headline); text-transform: uppercase; letter-spacing: 2px; }
.contact-box p { color: var(--muted); margin-bottom: 0; }

footer { background: #050505; border-top: 1px solid #222; padding: 40px 0; text-align: center; }
footer h3 { font-family: Cinzel, serif; }
footer span { color: var(--headline); }
footer p { color: #777; }

.instagram-btn {
  position: fixed; right: 22px; bottom: 92px; width: 55px; height: 55px; border-radius: 50%;
  background: linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 22px;
  text-decoration: none; z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: 0.2s;
}
.instagram-btn:hover { color: #fff; transform: scale(1.08); }

.whatsapp {
  position: fixed; right: 22px; bottom: 22px; width: 55px; height: 55px; border-radius: 50%;
  background-color: #25D366; color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 26px;
  text-decoration: none; z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: 0.2s;
}
.whatsapp:hover { background-color: #1ebe5d; color: #fff; transform: scale(1.08); }

@media(max-width:991px) {
  .hero-image-box { height: 350px; border-bottom-right-radius: 0; margin-bottom: 20px; }
  .hero-text-box { padding: 10px; }
}
</style>
</head>

<section class="hero-split-section" id="home">
<div class="container">
<div class="row align-items-center
