<script>
// FORCE PRELOADER REMOVAL (Guaranteed 1.2 seconds max)
window.addEventListener("DOMContentLoaded", function() {
  setTimeout(() => {
    const preloader = document.getElementById("preloader");
    if (preloader) {
      preloader.classList.add("fade-out");
    }
  }, 1200);
});

// WHATSAPP BOOKING SCRIPT
document.getElementById("bookingForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const message =
`ARUN'S CINEMATIC - BOOKING REQUEST

Name: ${document.getElementById("name").value}
Phone: ${document.getElementById("phone").value}
Event Date: ${document.getElementById("date").value}
Service: ${document.getElementById("service").value}
Package: ${document.getElementById("package").value}
Location: ${document.getElementById("location").value}

Requirements:
${document.getElementById("message").value}`;

  window.open(
    "https://wa.me/919600610409?text=" + encodeURIComponent(message),
    "_blank"
  );
});
</script>
